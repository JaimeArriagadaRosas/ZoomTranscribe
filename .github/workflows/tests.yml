name: tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile app
        run: python -m compileall -q app tests/test_jobs.py tests/test_providers.py tests/test_cleanup.py

      - name: Run unit tests
        run: python -m unittest -v tests.test_jobs tests.test_providers tests.test_cleanup
