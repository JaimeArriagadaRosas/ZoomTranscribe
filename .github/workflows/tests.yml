name: tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python -m compileall -q app scripts tests

      - name: Run unit tests
        run: python -m unittest discover -v
