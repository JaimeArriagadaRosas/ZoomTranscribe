name: v2-tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile v2 app
        run: python -m compileall -q app tests/test_v2_jobs.py tests/test_v2_providers.py tests/test_v2_cleanup.py

      - name: Run v2 unit tests
        run: python -m unittest -v tests.test_v2_jobs tests.test_v2_providers tests.test_v2_cleanup
